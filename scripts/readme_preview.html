<main><header><div><div class="eyebrow">NIGHTGLASS PROTOCOL / LEDGER</div><h1>Aether Ledger</h1><p class="muted" data-en="How I use agents, and how that changes.">我怎样使用 Agents，以及这些习惯如何变化。</p></div><div class="tabs" id="language"><button data-value="zh" aria-pressed="true">中文</button><button data-value="en" aria-pressed="false">EN</button></div></header>
<div class="toolbar"><div class="tabs" id="mode"><button data-value="live" aria-pressed="true">真实数据</button><button data-value="demo" aria-pressed="false">布局示例</button></div><small id="artifact"></small></div><div id="notice" class="notice"></div>
<section class="section"><div class="eyebrow">01 / ACTIVITY</div><h2 id="heatTitle"></h2><div class="heat">__HEATMAP__</div><small id="heatNote"></small></section>
<div class="toolbar"><div class="tabs" id="role"><button data-value="work" aria-pressed="true">工作</button><button data-value="personal" aria-pressed="false">个人</button></div><div class="tabs" id="period"><button data-value="7" aria-pressed="false">7d</button><button data-value="28" aria-pressed="true">28d</button></div></div>
<section class="section"><div class="eyebrow">02 / EXECUTION</div><h2 id="execTitle"></h2><div id="summary" class="cards"></div><div class="card"><div class="cardhead"><b id="computeTitle"></b><div class="tabs" id="compute"><button data-value="mix" aria-pressed="true">组合</button><button data-value="trend" aria-pressed="false">趋势</button></div></div><div id="computeBody"></div><div class="read" id="computeNote"></div></div><div class="card"><div class="cardhead"><b id="assignmentTitle"></b><small id="assignmentDate"></small></div><div id="assignment"></div></div></section>
<section class="section"><div class="eyebrow">03 / TASK PROCESS</div><h2 id="processTitle"></h2><div class="card"><div class="cardhead"><b id="processMetric"></b><div class="tabs" id="metric"><button data-value="comments" aria-pressed="true">人工评论</button><button data-value="amplification" aria-pressed="false">执行放大</button><button data-value="returns" aria-pressed="false">流程回流</button></div></div><div id="processChart"></div><div class="read" id="processNote"></div></div>
<div class="two"><div class="card"><div class="cardhead"><b id="distTitle"></b><div class="tabs" id="group"><button data-value="standalone" aria-pressed="true">独立</button><button data-value="parent" aria-pressed="false">父</button><button data-value="child" aria-pressed="false">子</button></div></div><div id="distribution"></div><div class="read" id="distNote"></div></div><div class="card"><div class="cardhead"><b id="readTitle"></b></div><div id="reading"></div></div></div></section><footer id="footer"></footer></main>
<script>
const live=__LEDGER_DATA__;
const state={language:'zh',mode:new URLSearchParams(location.search).get('example')==='1'?'demo':'live',role:'work',period:'28',compute:'mix',metric:'comments',group:'standalone'};let selectedCombination='';
const colors={codex:'#1e66f5',claude:'#fe640b',traex:'#8839ef',dsh:'#ea76cb',legacy:'#6c6f85'};
const names={codex:'Codex',claude:'Claude Code',traex:'TRAEX',dsh:'DSH',legacy:'Legacy'};
const $=id=>document.getElementById(id), t=(zh,en)=>state.language==='zh'?zh:en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n==null?'—':n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);
function fixture(role){const days={},activityDays={}; const configs=[['codex','gpt-6-astra','low',110],['codex','gpt-6-astra','medium',80],['claude','claude-opus-4-6','xhigh',44],['traex','gpt-5.5','medium',36],['dsh','deepseek-v4-pro','high',12]];for(let i=0;i<28;i++){const d='2026-08-'+String(i+1).padStart(2,'0'),scale=role==='work'?1:.37;days[d]=configs.map(([h,m,e,n],j)=>({harness:h,model:m,effort:e,tokens:Math.round(n*100000*scale*(.4+((i*7+j*3)%11)/10)*(j===0?1+i/35:1))}));const human=Math.round((5+(i*3)%17)*scale);activityDays[d]={valid:true,humanComments:human,agentComments:human+8,replies:human+2,humanTriggeredRuns:human+(i%5===0?8:1),triggeringHumanComments:human,reviewReturns:i%6===0?3:0,reopens:i%10===0?1:0,runsCreated:human+10};}return {days,sources:['codex','claude','traex','dsh'],assignment:configs.map(([h,m,e],i)=>({harness:h,model:m,effort:e,issues:{done:Math.round((20-i*3)*(role==='work'?1:.5))}})),assignmentDate:'2026-08-28',activity:{status:'ok',lastSuccess:'2026-08-29',metrics:{activity:{effectiveFrom:'2026-08-01'}},days:activityDays,current:{available:true,humanCommentDistribution:{standalone:{zero:6,oneTwo:9,threeFive:7,sixTen:3,elevenPlus:2},parent:{zero:1,oneTwo:2,threeFive:2,sixTen:3,elevenPlus:4},child:{zero:9,oneTwo:7,threeFive:2,sixTen:1,elevenPlus:0}}}}};}
function empty(message){return '<div class="empty"><b>'+t('等待有效统计','Awaiting verified data')+'</b><span>'+message+'</span></div>';}
function dates(end,n){return Array.from({length:n},(_,i)=>{const d=new Date(end+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-n+1+i);return d.toISOString().slice(0,10)});}
function chart(ds,series){const w=1000,h=210,left=50,bottom=175,top=18;const max=Math.max(1,...ds.map(d=>series.reduce((s,x)=>s+(x.values[d]||0),0)));const step=(w-left-10)/ds.length;let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('按日变化','Daily trend'))}">`;for(let j=0;j<4;j++){let y=bottom-(bottom-top)*j/3;s+=`<line x1="${left}" y1="${y}" x2="990" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="42" y="${y+4}" text-anchor="end">${num(Math.round(max*j/3*10)/10)}</text>`;}ds.forEach((d,i)=>{let y=bottom;const missing=series.every(x=>x.values[d]==null);if(missing)s+=`<text x="${left+step*(i+.5)}" y="${bottom-5}" text-anchor="middle">—</text>`;else series.forEach(x=>{const v=x.values[d]||0,bh=(bottom-top)*v/max;y-=bh;s+=`<rect x="${left+step*i+step*.2}" y="${y}" width="${step*.6}" height="${bh}" rx="2" fill="${x.color}"><title>${esc(d+' · '+x.label+': '+v)}</title></rect>`;});if(i===0||i===ds.length-1||i%7===0)s+=`<text x="${left+step*(i+.5)}" y="201" text-anchor="middle">${d.slice(5)}</text>`;});return s+'</svg><div class="legend">'+series.map(x=>`<span><i class="dot" style="background:${x.color}"></i>${esc(x.label)}</span>`).join('')+'</div>';}
function bars(rows){if(!rows.length)return empty(t('暂无可展示的记录','No records to display'));const max=Math.max(1,...rows.map(r=>r.value));return '<table class="rows"><tbody>'+rows.map(r=>`<tr><td>${r.label}</td><td style="width:40%"><div class="track"><div class="bar" style="width:${r.value/max*100}%;background:${r.color||colors.codex}"></div></div></td><td>${num(r.value)}</td></tr>`).join('')+'</tbody></table>';}
function render(){const demo=state.mode==='demo',data=demo?fixture(state.role):live[state.role];const all=Object.keys(data.days).sort();const ds=all.length?dates(all.at(-1),+state.period):[];const covered=ds.filter(d=>d in data.days);const combos={};covered.forEach(d=>data.days[d].forEach(r=>{const k=[r.harness,r.model,r.effort].join('|');combos[k]??={...r,tokens:0};combos[k].tokens+=r.tokens;}));const rows=Object.values(combos).sort((a,b)=>b.tokens-a.tokens),total=rows.reduce((s,r)=>s+r.tokens,0);
$('notice').className='notice'+(demo?' demo':'');$('notice').textContent=demo?t('布局示例：下方执行与任务推进使用虚构的 28 天数据，仅用于评估图形与切换；热力图仍为真实历史。','Layout example: execution and task panels use fictional 28-day data. The heatmap remains real history.'):t('真实视图：只读取仓库公开汇总；新统计没有有效日期时保留空态。','Live view: public repository aggregates only. New metrics stay empty until verified dates exist.');
$('artifact').textContent=t('README 候选预览 · 尚未发布','README candidate · unpublished');$('heatTitle').textContent=t('使用节奏','Activity rhythm');$('heatNote').textContent=t('完整历史 · 所有环境 · Token 包含缓存读取；费用为 API 等价估算。此图不随下方筛选变化。','Full history · all environments · tokens include cache reads; cost is an API-equivalent estimate. Independent of filters below.');$('execTitle').textContent=t('任务交给谁，算力花在哪里','Who handles tasks, where compute goes');$('computeTitle').textContent=t('Harness × Model × Effort','Harness × Model × Effort');$('summary').innerHTML=[[covered.length?num(total):'—',t('Token · 所选有效日期','Tokens · selected verified dates')],[covered.length?rows.length:'—',t('实际使用的组合','Observed configurations')],[covered.length+'/'+state.period,t('已覆盖天数','Covered days')],[new Set(rows.map(r=>r.harness)).size||'—',t('使用中的 Harness','Active harnesses')]].map(([v,l])=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`).join('');
if(!covered.length)$('computeBody').innerHTML=empty(t('Model × Effort 的有效数据尚未发布','Verified model × effort data is not yet published'));else if(state.compute==='mix')$('computeBody').innerHTML=bars(rows.map(r=>({label:`<b>${esc(names[r.harness]||r.harness)}</b> <span class="muted">/ ${esc(r.model)}</span> <span class="pill">${esc(r.effort)}</span>`,value:r.tokens,color:colors[r.harness]})));else $('computeBody').innerHTML=chart(ds,Object.keys(colors).filter(h=>rows.some(r=>r.harness===h)).map(h=>({label:names[h],color:colors[h],values:Object.fromEntries(covered.map(d=>[d,data.days[d].filter(r=>r.harness===h).reduce((s,r)=>s+r.tokens,0)]))})));
if(covered.length&&state.compute==='trend'){
const keys=rows.map(r=>[r.harness,r.model,r.effort].join('|'));if(!keys.includes(selectedCombination))selectedCombination='';
const select=document.createElement('select');select.style.cssText='max-width:100%;padding:8px;margin-bottom:14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)';select.setAttribute('aria-label',t('趋势组合','Trend configuration'));select.innerHTML='<option value="">'+t('所有 Harness','All harnesses')+'</option>'+rows.map(r=>{const key=[r.harness,r.model,r.effort].join('|');return '<option value="'+esc(key)+'">'+esc((names[r.harness]||r.harness)+' / '+r.model+' · '+r.effort)+'</option>';}).join('');select.value=selectedCombination;select.onchange=()=>{selectedCombination=select.value;render();};
if(selectedCombination){const [h,m,e]=selectedCombination.split('|');$('computeBody').innerHTML=chart(ds,[{label:(names[h]||h)+' / '+m+' · '+e,color:colors[h],values:Object.fromEntries(covered.map(d=>[d,data.days[d].filter(r=>r.harness===h&&r.model===m&&r.effort===e).reduce((s,r)=>s+r.tokens,0)]))}]);}
$('computeBody').prepend(select);
}
$('computeNote').textContent=covered.length?t(`${covered[0]} — ${covered.at(-1)} · ${covered.length} 个有效日 · 同一角色所有已发布来源的共同有效日期；横条共用 Token 比例尺。`,` ${covered[0]} — ${covered.at(-1)} · ${covered.length} verified days · intersection of published sources for this role; shared token scale.`):t('旧日志中的模型与 Effort 不拼接成组合；缺失日期不补零。','Legacy model and effort marginals are not joined; missing days are not zero.');
$('assignmentTitle').textContent=t('Issue 分配 · 按 Harness 合并','Issue assignment · grouped by harness');$('assignmentDate').textContent=data.assignmentDate||t('暂无快照','No snapshot');const assigned={};data.assignment.forEach(r=>assigned[r.harness]=(assigned[r.harness]||0)+Object.values(r.issues).reduce((a,b)=>a+b,0));$('assignment').innerHTML=bars(Object.entries(assigned).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([h,n])=>({label:esc(names[h]||h),value:n,color:colors[h]})));
$('processTitle').textContent=t('任务推进是否变得更费力','Is task progress becoming more demanding?');const a=data.activity;const start=a?.metrics?.activity?.effectiveFrom;const valid=Object.keys(a?.days||{}).filter(d=>a.status==='ok'&&start&&d>=start&&a.days[d].valid).sort();const ad=valid.length?dates(valid.at(-1),+state.period):[];let series=[];const values=fn=>Object.fromEntries(ad.filter(d=>valid.includes(d)).map(d=>[d,fn(a.days[d])]));if(state.metric==='comments'){series=[{label:t('人工评论','Human comments'),color:colors.codex,values:values(r=>r.humanComments)}];$('processNote').textContent=t('看人工参与是否持续增加，再结合任务量与任务年龄判断。评论包含澄清、决策和补充，不等于纠错轮次。','Look for sustained changes in human participation, then check task volume and age. Comments include clarification and decisions, not just corrections.');}else if(state.metric==='amplification'){series=[{label:t('执行数 / 触发评论','Runs / triggering comments'),color:colors.traex,values:values(r=>r.triggeringHumanComments?r.humanTriggeredRuns/r.triggeringHumanComments:null)}];$('processNote').textContent=t('同一人工评论触发的执行数。升高时可检查重复派发或环境故障；不直接代表浪费。无触发评论的日期不计算比值。','Runs linked to each triggering human comment. Increases can prompt checks for redispatch or environment failures; they do not establish waste. No denominator means no ratio.');}else{series=[{label:t('Review → 进行中','Review → in progress'),color:colors.claude,values:values(r=>r.reviewReturns)},{label:t('完成后重开','Reopened after done'),color:colors.traex,values:values(r=>r.reopens)}];$('processNote').textContent=t('回流持续增加时，可检查验收边界或任务拆分；这些是状态事件，不能直接视为验收失败。','Sustained increases can prompt a review of acceptance scope or task breakdown. These are state transitions, not proven acceptance failures.');}$('processMetric').textContent=series[0].label;$('processChart').innerHTML=valid.length?chart(ad,series)+`<small>${ad[0]} — ${ad.at(-1)} · ${ad.filter(d=>valid.includes(d)).length}/${state.period} ${t('有效日','verified days')}</small>`:empty(t('等待 Issue 活动的有效日期','Awaiting verified issue-activity dates'));
$('distTitle').textContent=t('每个 Issue 的人工评论数','Human comments per issue');const dist=a?.current?.available?a.current.humanCommentDistribution[state.group]:null;$('distribution').innerHTML=dist?bars(Object.entries(dist).map(([k,n],i)=>({label:['0','1–2','3–5','6–10','11+'][i],value:n,color:colors.codex}))):empty(t('等待当前任务快照','Awaiting a current issue snapshot'));$('distNote').textContent=t('横轴为 Issue 数；统计当前任务保留的累计评论。任务年龄未对齐，各组不能直接比较优劣。','Bars count issues using retained lifetime comments on current tasks. Task ages are not matched; groups are not a performance ranking.');$('readTitle').textContent=t('这些变化能帮我检查什么','What can these changes help me inspect?');$('reading').innerHTML=t('<p><b>人工参与持续增加</b><br><small>先看任务量是否也增长，再检查需求是否需要反复补充。</small></p><p><b>单次输入触发更多执行</b><br><small>检查派发与运行环境，别先归因于模型能力。</small></p><p><b>长讨论集中在父任务</b><br><small>可能承担统筹职责；应在同类任务中观察变化。</small></p>','<p><b>Human participation keeps rising</b><br><small>Check task volume first, then repeated scope clarification.</small></p><p><b>One input triggers more runs</b><br><small>Inspect dispatch and runtime conditions before blaming model capability.</small></p><p><b>Long discussions cluster in parent tasks</b><br><small>Coordination may explain this; compare similar tasks over time.</small></p>');$('footer').textContent=t('仅展示匿名汇总。Chat 占比、每 Issue Token 和真实交互轮次尚无可靠公开统计，暂不展示。预览中的按钮不代表 GitHub README 原生支持交互。','Anonymous aggregates only. Chat share, tokens per issue and human interaction turns lack reliable public metrics and are omitted. Preview controls do not imply native GitHub README interactivity.');
const labels={mode:[t('真实数据','Real data'),t('布局示例','Layout example')],role:[t('工作','Work'),t('个人','Personal')],compute:[t('组合','Mix'),t('趋势','Trend')],metric:[t('人工评论','Comments'),t('执行放大','Run amplification'),t('流程回流','Returns')],group:[t('独立','Standalone'),t('父','Parent'),t('子','Child')]};Object.entries(labels).forEach(([id,texts])=>[...$(id).children].forEach((b,i)=>b.textContent=texts[i]));document.documentElement.lang=state.language==='zh'?'zh-CN':'en';document.querySelector('[data-en]').textContent=t('我怎样使用 Agents，以及这些习惯如何变化。','How I use agents, and how that changes.');}
Object.keys(state).forEach(id=>[...$(id).children].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state[id]))));
Object.keys(state).forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[id]=b.dataset.value;[...$(id).children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));render();
</script></html>
