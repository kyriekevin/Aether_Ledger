name: Daily usage rollover

on:
  schedule:
    # The second idempotent pass recovers if GitHub delays or drops the first
    # scheduled event. A successful first pass leaves nothing for it to do.
    - cron: "11,41 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-usage-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Validate renderer
        run: |
          uv run python -m unittest discover -s tests -v
          uv run --script scripts/audit_public.py

      - name: Squash completed day branches into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/usage/*:refs/remotes/origin/usage/*'

          today="$(date +%F)"
          mapfile -t completed < <(
            git for-each-ref --format='%(refname:strip=4)' refs/remotes/origin/usage/ \
              | awk -v today="$today" '$0 < today' \
              | sort
          )

          merged=()
          for day in "${completed[@]}"; do
            branch="usage/$day"
            uv run --script scripts/squash_usage_branch.py "origin/$branch"
            uv run --script scripts/audit_public.py
            uv run --script scripts/render_dashboard.py --as-of "$day"
            git add assets/token-activity.svg assets/token-composition.svg assets/token-topology.svg
            if git diff --cached --quiet; then
              git reset --merge
            else
              git commit -m "chore(data): finalize $day snapshot"
            fi
            merged+=("$branch")
          done

          if ((${#merged[@]})); then
            git push origin HEAD:main
            for branch in "${merged[@]}"; do
              git push origin --delete "$branch"
            done
          fi

          today_branch="usage/$today"
          if ! git ls-remote --exit-code --heads origin "$today_branch" >/dev/null 2>&1; then
            git push origin HEAD:"refs/heads/$today_branch"
          fi
