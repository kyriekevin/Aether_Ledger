name: Daily usage rollover

on:
  schedule:
    # The second idempotent pass recovers if GitHub delays or drops the first
    # scheduled event. A successful first pass leaves nothing for it to do.
    - cron: "11,41 0 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  checks: write
  contents: write

concurrency:
  group: daily-usage-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Validate renderer
        run: |
          uv run python -m unittest discover -s tests -v
          uv run --script scripts/audit_public.py
          python3 -m py_compile scripts/*.py

      - name: Squash completed day branches into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/usage/*:refs/remotes/origin/usage/*'

          today="$(date +%F)"
          mapfile -t completed < <(
            git for-each-ref --format='%(refname:strip=4)' refs/remotes/origin/usage/ \
              | awk -v today="$today" '$0 < today' \
              | sort
          )

          merged=()
          for day in "${completed[@]}"; do
            branch="usage/$day"
            uv run --script scripts/squash_usage_branch.py "origin/$branch"
            uv run --script scripts/audit_public.py
            # No --as-of: the renderer derives the day from the data, the same
            # way the freshness check below and CI do. Pinning it here would
            # render a day with no activity as the newest column while the
            # check expects the last active one, and that disagreement would
            # fail every retry, stranding the day branch and stopping today's
            # branch from ever being created. An idle day now simply produces
            # no snapshot commit.
            uv run --script scripts/render_dashboard.py
            git add assets/token-activity.svg assets/token-topology.svg
            if git diff --cached --quiet; then
              git reset --merge
            else
              git commit -m "chore(data): finalize $day snapshot"
            fi
            merged+=("$branch")
          done

          if ((${#merged[@]})); then
            # Validate before publishing. This push is authenticated with
            # GITHUB_TOKEN, which by design does not start another workflow run,
            # so verify.yml never sees these commits and this block is their only
            # gate. It is also the last point at which a bad merge is still
            # recoverable: the day branches are deleted immediately after.
            # Failing leaves main untouched and the day branches intact for the
            # next scheduled pass.
            uv run --script scripts/audit_public.py
            uv run --script scripts/render_dashboard.py --check
            uv run --script scripts/audit_public.py --history "origin/main..HEAD"
            git diff --check "origin/main...HEAD"

            # Required checks protect human merges, but this workflow is also the
            # only legitimate direct writer to main. Publish the already-audited
            # candidate SHA on a temporary branch, attach this GitHub Actions
            # check to that exact commit, then advance main. A failure before the
            # main push leaves completed usage branches intact for the retry.
            candidate_sha="$(git rev-parse HEAD)"
            candidate_branch="rollover-candidate/$candidate_sha"
            git push origin HEAD:"refs/heads/$candidate_branch"
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name=checks \
              -f head_sha="$candidate_sha" \
              -f status=completed \
              -f conclusion=success \
              -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

            git push origin HEAD:main
            for branch in "${merged[@]}"; do
              git push origin --delete "$branch"
            done
            git push origin --delete "$candidate_branch"
          fi

          today_branch="usage/$today"
          if ! git ls-remote --exit-code --heads origin "$today_branch" >/dev/null 2>&1; then
            git push origin HEAD:"refs/heads/$today_branch"
          fi

      - name: Reconcile observed models with official pricing
        # This is deliberately after main publication, completed-branch cleanup,
        # and today's branch creation. A new model makes the close visibly red
        # without stranding usage data or violating rollover's recovery order.
        run: uv run --script scripts/update_pricing.py --require-observed-prices
